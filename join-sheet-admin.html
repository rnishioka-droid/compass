<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMPASS 入社一覧連携</title><style>
body{font:13px/1.6 system-ui,sans-serif;color:#253b38;background:#f4f7f6;margin:0}main{max-width:1000px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid #d9e3e0;border-radius:10px;padding:18px;margin-bottom:14px}h1{font-size:20px;margin:0 0 6px}button{border:1px solid #b8cfca;border-radius:6px;background:#fff;color:#146d63;padding:7px 14px;cursor:pointer}button.primary{background:#087f72;color:#fff}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:block;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:11px}td,th{border-bottom:1px solid #e2e9e7;padding:5px 7px;text-align:left;overflow-wrap:anywhere}th{background:#edf4f2;position:sticky;top:0}.scroll{max-height:480px;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 system-ui}a{color:#087f72}#message{white-space:pre-wrap}input[type=checkbox]{accent-color:#087f72}</style></head><body><main>
<section class="panel"><h1>入社一覧スプレッドシート連携</h1><p>D1を正本として、指定の2シートへ一方向に反映します。通常のCOMPASSでログインしてから開いてください。</p><div class="actions"><a href="hr-agency-admin.html">COMPASSへ戻る</a><button id="status">状態を更新</button><button id="connection">Google読取接続を確認</button><button id="preview">同期対象を確認（書き込みなし）</button></div><p id="message" role="status">接続確認中…</p></section>
<section class="panel"><strong id="counts">対象は未確認です</strong><p>同期先：<a href="https://docs.google.com/spreadsheets/d/1Hx-BkC_-PNrDl8LPJ9sS2IS3AOtEFbPN1fu75ljctls/edit" target="_blank" rel="noopener">COMPASS｜入社一覧（受注確定・入社済み）</a></p><label><input id="confirm" type="checkbox" disabled>対象一覧・除外理由・返金規定の要確認を確認し、この内容の同期を承認します。</label><div class="actions"><button id="enqueue" class="primary" disabled>同期を予約</button><button id="download" disabled>監査一覧をJSONで保存</button><button id="logs">同期ログを確認</button></div><p>予約後、次のCron実行で反映します（通常5分間隔）。同期先が変更された場合は、もう一度対象確認が必要です。</p></section>
<section class="panel"><div class="scroll"><table><thead><tr><th>案件ID</th><th>担当</th><th>施設</th><th>確定区分</th><th>シート1</th><th>シート2</th><th>除外理由／要確認</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><pre id="details"></pre></section>
</main><script src="compass-d1-client.js"></script><script>
"use strict";
const bootUrl=new URL(window.location.href);
if(bootUrl.searchParams.has("env")||bootUrl.searchParams.has("d1Api")){bootUrl.searchParams.delete("env");bootUrl.searchParams.delete("d1Api");window.history.replaceState(null,"",bootUrl.pathname+bootUrl.search+bootUrl.hash);}
const client=createCompassD1Client("https://compass-api.r-nishioka.workers.dev");let plan=null,busy=false;const $=id=>document.getElementById(id);function text(id,value){$(id).textContent=value;}function update(){ $("enqueue").disabled=busy||!plan||!$("confirm").checked;$("confirm").disabled=busy||!plan;$("download").disabled=!plan; }
async function run(action){if(busy)return;busy=true;update();try{await action();}catch(e){text("message",e.message||"通信に失敗しました");}finally{busy=false;update();}}
async function status(){const s=await client.request("/api/join-sheet/status");text("details",JSON.stringify(s,null,2));text("message",!s.schemaReady?"連携用テーブルは未設定です。対象確認はできますが同期はできません。":s.queued?"同期予約済みです。次のCron実行後に状態を更新してください。":s.lastError?`前回の同期：${s.lastError}。再度プレビューして再試行できます。`:s.initialized?`最終正常同期：${s.lastSuccessAt||"-"}`:"初回同期は未実施です。対象確認後に承認してください。");}
$("connection").onclick=()=>run(async()=>{const r=await client.request("/api/join-sheet/connection");text("message",r.message);});$("status").onclick=()=>run(status);$("preview").onclick=()=>run(async()=>{plan=await client.request("/api/join-sheet/preview");$("confirm").checked=false;text("counts",`受注・仮受注確定 ${plan.counts.sheet1}件 ／ 入社済み ${plan.counts.sheet2}件 ／ 対象外 ${plan.counts.excluded}件 ／ 返金規定要確認 ${plan.counts.policyReview}件`);const frag=document.createDocumentFragment();for(const item of plan.audit){const tr=document.createElement("tr");for(const v of [item.applicationId,item.owner,item.facility,item.confirmation||"-",item.includedSheet1?"対象":"対象外",item.includedSheet2?"対象":"対象外",[...item.reasons,...item.warnings].join(" / ")]){const td=document.createElement("td");td.textContent=v;tr.append(td);}frag.append(tr);}$("rows").replaceChildren(frag);text("details",JSON.stringify({asOf:plan.asOfDay,sourceVersion:plan.sourceVersion,planHash:plan.planHash,standardPolicy:plan.standardPolicy,irregular:plan.irregular,unconfirmed:plan.unconfirmed},null,2));text("message","書き込みなしの対象確認が完了しました。内容を確認してください。");});
$("confirm").onchange=update;$("enqueue").onclick=()=>run(async()=>{const r=await client.request("/api/join-sheet/sync",{method:"POST",body:{expectedPlanHash:plan.planHash,confirmInitial:true}});text("message",r.message);plan=null;$("confirm").checked=false;});
$("logs").onclick=()=>run(async()=>text("details",JSON.stringify(await client.request("/api/join-sheet/logs"),null,2)));$("download").onclick=()=>{if(!plan)return;const url=URL.createObjectURL(new Blob([JSON.stringify(plan,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="COMPASS-join-sheet-audit.json";a.click();URL.revokeObjectURL(url);};run(async()=>{const user=await client.auth.getUser();if(user.error)throw user.error;await status();});
</script></body></html>
